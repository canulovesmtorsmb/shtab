# Локальный Worker для тестов: тот же worker.js, база D1 в папке .wrangler рядом.
name = "shtab-sync-test"
main = "../worker.js"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "shtab"
database_id = "00000000-0000-0000-0000-000000000000"
